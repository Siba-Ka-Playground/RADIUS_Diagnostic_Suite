<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZTAA RADIUS Diagnostic Suite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <span class="icon">🛡️</span>
            <div>
                <h1>RADIUS Diagnostic Suite</h1>
                <div class="subtitle">Zero Trust Authentication Analyzer</div>
            </div>
        </div>
        <div class="hud">
            <div class="hud-item"><span class="hud-label">TARGET IdP:</span> <span class="hud-val" id="hud-server">UNCONFIGURED</span></div>
            <div class="hud-item"><span class="hud-label">NAS INJECT:</span> <span class="hud-val" id="hud-nas">{{ default_nas }}</span></div>
            <div class="hud-item"><span class="hud-label">PORT:</span> <span class="hud-val">UDP 1812</span></div>
            <div class="status-indicator"></div>
        </div>
    </header>

    <main class="grid-container">
        <div class="sidebar">
            
            <!-- NEW: Server Configuration Panel -->
            <div class="panel" style="margin-bottom: 20px;">
                <div class="panel-header">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
                    Server Configuration
                </div>
                <div class="form-group">
                    <label>RADIUS Server IP / Host</label>
                    <input type="text" id="server_ip" placeholder="e.g., 192.168.1.10" oninput="document.getElementById('hud-server').innerText = this.value || 'UNCONFIGURED'">
                </div>
                <div class="form-group">
                    <label>Shared Secret</label>
                    <input type="password" id="shared_secret" placeholder="••••••••••••">
                </div>
                <div class="form-group">
                    <label>Client NAS-IP-Address</label>
                    <input type="text" id="nas_ip" value="{{ default_nas }}" placeholder="Auto-detected" oninput="document.getElementById('hud-nas').innerText = this.value || 'UNCONFIGURED'">
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                    Payload Configuration
                </div>
                <div class="form-group">
                    <label>Target Identity (Username)</label>
                    <input type="text" id="username" placeholder="e.g., admin_user" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Primary Secret (Password)</label>
                    <input type="password" id="password" placeholder="••••••••••••">
                </div>
                <div class="form-group">
                    <label>RFC 6238 Key (TOTP Secret)</label>
                    <input type="text" id="totp_secret" placeholder="Optional Base32 Secret">
                </div>
                <button class="btn-primary" onclick="initiateAttack()">Initiate Primary Auth</button>
            </div>

            <div class="panel" id="mfa-section">
                <div class="panel-header" style="color: var(--accent-yellow); border-bottom-color: rgba(245, 158, 11, 0.3);">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    Stateful Challenge Required
                </div>
                <div id="challenge-msg" class="challenge-text"></div>
                <input type="hidden" id="state_hex">
                
                <div class="form-group" style="margin-top: 20px;">
                    <label>OTP / Trigger Command</label>
                    <input type="text" id="mfa_input" placeholder="Code">
                </div>
                <button class="btn-warning" onclick="transmitMfa()">Transmit Response</button>
            </div>
        </div>

        <div class="main-content">
            <div class="panel terminal-panel" style="height: 100%;">
                <div class="terminal-header">
                    <span>Live Packet Diagnostics</span>
                    <button class="btn-clear" onclick="clearTerminal()">Clear Console</button>
                </div>
                <div class="terminal" id="terminal">
                    <div class="log-entry"><span class="c-cyan">[SYSTEM] Diagnostic Engine Initialized. Awaiting Server Parameters...</span></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
